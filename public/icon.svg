<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0F172A" />
  <!-- Glow Effect -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)" />
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#grad)" stroke-width="12" stroke-dasharray="10 15" opacity="0.8" />
  <!-- Inner Ring -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="url(#grad)" stroke-width="6" stroke-dasharray="40 10" opacity="0.6" />
  <!-- Core sphere -->
  <circle cx="256" cy="256" r="60" fill="url(#grad)" />
  <!-- Connector Nodes -->
  <line x1="256" y1="116" x2="256" y2="196" stroke="#FFFFFF" stroke-width="4" opacity="0.5" />
  <line x1="256" y1="316" x2="256" y2="396" stroke="#FFFFFF" stroke-width="4" opacity="0.5" />
  <line x1="116" y1="256" x2="196" y2="256" stroke="#FFFFFF" stroke-width="4" opacity="0.5" />
  <line x1="316" y1="256" x2="396" y2="256" stroke="#FFFFFF" stroke-width="4" opacity="0.5" />
  <!-- Small Nodes -->
  <circle cx="256" cy="116" r="12" fill="#EF4444" />
  <circle cx="256" cy="396" r="12" fill="#3B82F6" />
  <circle cx="116" cy="256" r="12" fill="#3B82F6" />
  <circle cx="396" cy="256" r="12" fill="#EF4444" />
  <circle cx="256" cy="256" r="8" fill="#FFFFFF" />
</svg>
